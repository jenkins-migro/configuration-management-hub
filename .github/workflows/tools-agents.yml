name: Tools and Agents

on:
  workflow_dispatch:
  push:
    paths:
      - toolsagents/**
      - .github/workflows/tools-agents.yml
  pull_request:
    paths:
      - toolsagents/**
      - .github/workflows/tools-agents.yml

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: toolsagents

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 11
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Build
        run: |
          echo "M2_HOME: ${M2_HOME:-}"
          echo "JAVA_HOME: ${JAVA_HOME}"
          mvn clean compile -Dmaven.test.skip=true
      - name: Upload build artifacts
        if: ${{ hashFiles('toolsagents/target/**/*') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tools-agents-build-artifacts
          path: toolsagents/target/**/*

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 11
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tools-agents-build-artifacts
          path: toolsagents/target
      - name: Test
        run: mvn test
      - name: Upload test and coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tools-agents-test-and-coverage
          path: |
            toolsagents/target/surefire-reports/*.xml
            toolsagents/target/site/jacoco/jacoco.xml
          if-no-files-found: warn

  quality:
    name: Quality
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 11
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '11'
      - name: SonarQube analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        run: mvn sonar:sonar -Dsonar.login="$SONAR_TOKEN"
