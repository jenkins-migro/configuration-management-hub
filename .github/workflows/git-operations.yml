name: Git Operations

on:
  workflow_dispatch:
    inputs:
      update_version:
        description: Commit and push Maven version update
        type: boolean
        default: false
  push:
    paths:
      - gitoperations/**
      - .github/workflows/git-operations.yml
  pull_request:
    paths:
      - gitoperations/**
      - .github/workflows/git-operations.yml

permissions:
  contents: write

defaults:
  run:
    shell: bash
    working-directory: gitoperations

jobs:
  build-test-release:
    name: Build, test, tag, and archive
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Capture Git metadata
        run: |
          echo "GIT_COMMIT_SHORT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "GIT_BRANCH=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
      - name: Build
        run: |
          echo "Building commit ${GIT_COMMIT_SHORT} from branch ${GIT_BRANCH}"
          mvn clean package -DskipTests
      - name: Test
        run: mvn test
      - name: Upload test results
        if: ${{ always() && hashFiles('gitoperations/**/surefire-reports/*.xml') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: git-operations-test-results
          path: gitoperations/**/surefire-reports/*.xml
      - name: Tag release
        if: ${{ github.event_name != 'pull_request' && github.ref_name == 'master' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG_NAME="v1.0.${GITHUB_RUN_NUMBER}"
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          git push origin "$TAG_NAME"
      - name: Update version
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_version }}
        run: |
          newVersion="1.0.${GITHUB_RUN_NUMBER}"
          mvn versions:set -DnewVersion="${newVersion}"
          mvn versions:commit
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          git commit -m "Update version to ${newVersion} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Create release notes
        run: |
          {
            echo "# Release Notes"
            echo "## Version: v1.0.${GITHUB_RUN_NUMBER}"
            echo "## Commit: ${GIT_COMMIT_SHORT}"
            echo "## Branch: ${GIT_BRANCH}"
            echo "## Changes:"
            git log --oneline HEAD~5..HEAD || git log --oneline
          } > RELEASE_NOTES.md
      - name: Upload package and release notes
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: git-operations-artifacts
          path: |
            gitoperations/target/*.jar
            gitoperations/RELEASE_NOTES.md
          if-no-files-found: warn
