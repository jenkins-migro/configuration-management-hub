name: SonarQube Gradle

on:
  workflow_dispatch:
  push:
    paths:
      - sonarqubegradle/**
      - .github/workflows/sonarqube-gradle.yml
  pull_request:
    paths:
      - sonarqubegradle/**
      - .github/workflows/sonarqube-gradle.yml

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: sonarqubegradle

jobs:
  build-test-analyze-package:
    name: Build, test, analyze, and package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE_NAME: my-app
      REGISTRY: registry.example.com
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        run: ./gradlew clean build
      - name: Test
        run: ./gradlew test
      - name: Upload test results
        if: ${{ always() && hashFiles('sonarqubegradle/build/test-results/test/*.xml') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sonarqube-gradle-test-results
          path: sonarqubegradle/build/test-results/test/*.xml
      - name: SonarQube analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          ./gradlew sonarqube \
            -Dsonar.projectKey=my-project \
            -Dsonar.projectName="My Project" \
            -Dsonar.projectVersion="${GITHUB_RUN_NUMBER}" \
            -Dsonar.sources=src/main \
            -Dsonar.tests=src/test \
            -Dsonar.java.binaries=build/classes \
            -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
      - name: Package
        run: ./gradlew bootJar
      - name: Upload application package
        if: ${{ hashFiles('sonarqubegradle/build/libs/*.jar') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sonarqube-gradle-jars
          path: sonarqubegradle/build/libs/*.jar
      - name: Docker build
        run: docker build -t "${REGISTRY}/${IMAGE_NAME}:${GITHUB_RUN_NUMBER}" .
      - name: Docker push
        if: ${{ github.event_name != 'pull_request' && env.REGISTRY_USERNAME != '' && env.REGISTRY_PASSWORD != '' }}
        run: |
          echo "${REGISTRY_PASSWORD}" | docker login "${REGISTRY}" --username "${REGISTRY_USERNAME}" --password-stdin
          docker push "${REGISTRY}/${IMAGE_NAME}:${GITHUB_RUN_NUMBER}"
          docker tag "${REGISTRY}/${IMAGE_NAME}:${GITHUB_RUN_NUMBER}" "${REGISTRY}/${IMAGE_NAME}:latest"
          docker push "${REGISTRY}/${IMAGE_NAME}:latest"
